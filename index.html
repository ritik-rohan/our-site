<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chitthi 💌 | Our Secret Corner</title>
  
  <!-- Google Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Firebase Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg: #fff5f7;
      --card-bg: #ffffff;
      --him-color: #7b9acc;
      --her-color: #e88a99;
      --text-dark: #332d30;
      --text-muted: #8c828a;
      --shadow: 0 10px 30px rgba(232, 138, 153, 0.12);
      --radius: 20px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    
    body {
      background-color: var(--bg);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 15px;
      overflow-x: hidden;
    }

    /* Floating Heart Effect Container */
    #heart-container {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }

    .floating-heart {
      position: absolute;
      font-size: 24px;
      animation: floatUp 3s ease-out forwards;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(100vh) scale(0.5) rotate(0deg); }
      100% { opacity: 0; transform: translateY(-10vh) scale(1.5) rotate(360deg); }
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      font-family: 'Dancing Script', cursive;
      font-size: 2.8rem;
      color: var(--her-color);
      margin-bottom: 4px;
    }

    header p {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    /* Main Grid */
    .container {
      width: 100%;
      max-width: 900px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 25px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(255, 255, 255, 0.8);
      position: relative;
    }

    .card.him { border-top: 5px solid var(--him-color); }
    .card.her { border-top: 5px solid var(--her-color); }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .card.him .card-title { color: var(--him-color); }
    .card.her .card-title { color: var(--her-color); }

    .timestamp {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .message-display {
      min-height: 120px;
      font-size: 1.05rem;
      line-height: 1.6;
      white-space: pre-wrap;
      color: var(--text-dark);
      background: #faf8f9;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
      word-break: break-word;
    }

    textarea {
      width: 100%;
      height: 80px;
      border: 1.5px solid #eedde2;
      border-radius: 12px;
      padding: 12px;
      font-size: 0.95rem;
      resize: none;
      outline: none;
      transition: border 0.2s;
      margin-bottom: 12px;
    }

    textarea:focus { border-color: var(--her-color); }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }

    button:active { transform: scale(0.97); }

    .btn-send {
      flex: 1;
      color: white;
    }

    .card.him .btn-send { background-color: var(--him-color); }
    .card.her .btn-send { background-color: var(--her-color); }

    .btn-nudge {
      background: #fff0f3;
      color: var(--her-color);
      border: 1px solid #ffd8e0;
    }

    /* Lock Screen Overlay */
    #lock-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10000;
    }

    .lock-box {
      background: white;
      padding: 35px 25px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      text-align: center;
      max-width: 320px;
      width: 90%;
    }

    .lock-box h2 {
      font-family: 'Dancing Script', cursive;
      font-size: 2.2rem;
      color: var(--her-color);
      margin-bottom: 10px;
    }

    .lock-box input {
      width: 100%;
      padding: 12px;
      margin: 15px 0;
      text-align: center;
      font-size: 1.2rem;
      letter-spacing: 4px;
      border: 1.5px solid #eedde2;
      border-radius: 10px;
      outline: none;
    }

    .lock-box button {
      width: 100%;
      background: var(--her-color);
      color: white;
    }
  </style>
</head>
<body>

  <div id="heart-container"></div>

  <!-- Lock Screen Modal -->
  <div id="lock-overlay">
    <div class="lock-box">
      <h2>Chitthi 💌</h2>
      <p style="font-size: 0.85rem; color: var(--text-muted);">Enter our secret code to open</p>
      <input type="password" id="passcode-input" placeholder="••••">
      <button onclick="unlockSite()">Unlock Corner</button>
    </div>
  </div>

  <!-- Header -->
  <header>
    <h1>Chitthi 💌</h1>
    <p>Our little cozy corner on the internet</p>
  </header>

  <!-- Main Cards -->
  <div class="container">
    
    <!-- HIM CARD -->
    <div class="card him">
      <div class="card-header">
        <span class="card-title">Him 💙</span>
        <span class="timestamp" id="him-time">No message yet</span>
      </div>
      <div class="message-display" id="him-display">Waiting for a note...</div>
      <textarea id="him-input" placeholder="Write a message..."></textarea>
      <div class="btn-group">
        <button class="btn-send" onclick="sendMessage('him')">Post Note</button>
        <button class="btn-nudge" onclick="sendNudge('Him')" title="Send Hearts">❤️</button>
      </div>
    </div>

    <!-- HER CARD -->
    <div class="card her">
      <div class="card-header">
        <span class="card-title">Her 💖</span>
        <span class="timestamp" id="her-time">No message yet</span>
      </div>
      <div class="message-display" id="her-display">Waiting for a note...</div>
      <textarea id="her-input" placeholder="Write a message..."></textarea>
      <div class="btn-group">
        <button class="btn-send" onclick="sendMessage('her')">Post Note</button>
        <button class="btn-nudge" onclick="sendNudge('Her')" title="Send Hearts">❤️</button>
      </div>
    </div>

  </div>

  <script>
    // ==========================================================
    // 1. YOUR FIREBASE CONFIGURATION (PASTE YOUR SNIPPET HERE)
    // ==========================================================
    const firebaseConfig = {
      apiKey: "AIzaSyBeUKP0MTcNj9dLpw3cZiNq8ec9vCUSyY4",
      authDomain: "chitthi-blog.firebaseapp.com",
      databaseURL: "https://chitthi-blog-default-rtdb.firebaseio.com",
      projectId: "chitthi-blog",
      storageBucket: "chitthi-blog.firebasestorage.app",
      messagingSenderId: "110151296215",
      appId: "1:110151296215:web:aae99e29035831aa773c92"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ==========================================================
    // 2. PASSCODE PROTECTION (DEFAULT CODE: 1234)
    // ==========================================================
    const SECRET_PASSCODE = "4157"; // <--- CHANGE THIS TO YOUR SPECIAL DATE OR PIN

    function unlockSite() {
      const input = document.getElementById('passcode-input').value;
      if (input === SECRET_PASSCODE) {
        document.getElementById('lock-overlay').style.display = 'none';
        localStorage.setItem('chitthi_unlocked', 'true');
      } else {
        alert("Incorrect code! Try again 💕");
      }
    }

    // Auto unlock if remembered
    if (localStorage.getItem('chitthi_unlocked') === 'true') {
      document.getElementById('lock-overlay').style.display = 'none';
    }

    // ==========================================================
    // 3. REALTIME MESSAGING LOGIC
    // ==========================================================
    function sendMessage(person) {
      const inputEl = document.getElementById(`${person}-input`);
      const text = inputEl.value.trim();

      if (!text) return;

      const now = new Date();
      const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + ' • ' + now.toLocaleDateString([], { month: 'short', day: 'numeric' });

      // Save to Firebase
      db.ref(`messages/${person}`).set({
        text: text,
        time: timeString
      });

      inputEl.value = '';
    }

    // Listen for live message updates from Firebase
    ['him', 'her'].forEach(person => {
      db.ref(`messages/${person}`).on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
          document.getElementById(`${person}-display`).innerText = data.text;
          document.getElementById(`${person}-time`).innerText = data.time;
        }
      });
    });

    // ==========================================================
    // 4. LIVE "THINKING OF YOU" NUDGES & FLOATING HEARTS
    // ==========================================================
    function sendNudge(senderName) {
      db.ref('nudge').set({
        sender: senderName,
        timestamp: Date.now()
      });
    }

    // Listen for nudges
    db.ref('nudge').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data && data.timestamp > (Date.now() - 5000)) {
        triggerHeartShower();
      }
    });

    function triggerHeartShower() {
      const container = document.getElementById('heart-container');
      const hearts = ['❤️', '💖', '💕', '🌸', '✨'];
      
      for (let i = 0; i < 25; i++) {
        setTimeout(() => {
          const heart = document.createElement('div');
          heart.className = 'floating-heart';
          heart.innerText = hearts[Math.floor(Math.random() * hearts.length)];
          heart.style.left = Math.random() * 100 + 'vw';
          heart.style.animationDuration = (Math.random() * 2 + 2) + 's';
          container.appendChild(heart);

          setTimeout(() => heart.remove(), 4000);
        }, i * 100);
      }
    }
  </script>
</body>
</html>
